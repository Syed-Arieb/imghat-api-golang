openapi: 3.0.3
info:
  title: imghat
  version: 0.2.0
  description: Image compression, resizing, and smart-fit API

servers:
  - url: http://localhost:3000/v1

paths:
  /image/compress:
    post:
      summary: Compress an image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                quality:
                  type: number
                  minimum: 1
                  maximum: 100
                  default: 80
                format:
                  type: string
                  enum: [png, webp]
                  default: png
                  description: Output image format
      responses:
        "200":
          description: Compressed image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMedia" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /image/resize:
    post:
      summary: Resize an image (scale down only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                width:
                  type: integer
                height:
                  type: integer
                mode:
                  type: string
                  enum: [fit, fill, exact]
                  default: fit
                quality:
                  type: number
                  default: 80
                format:
                  type: string
                  enum: [png, webp]
                  default: png
                  description: Output image format
      responses:
        "200":
          description: Resized image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMedia" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /image/fit:
    post:
      summary: Smart-fit image to a target aspect ratio with transparent padding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, ratio]
              properties:
                file:
                  type: string
                  format: binary
                ratio:
                  type: string
                  example: "1:1"
                  description: Target aspect ratio e.g. "1:1", "16:9"
                quality:
                  type: number
                  default: 80
                format:
                  type: string
                  enum: [png, webp]
                  default: png
                  description: Output image format
      responses:
        "200":
          description: Padded image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMedia" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMedia:
      description: File is not PNG or WebP
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Image could not be processed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: File exceeds maximum allowed size
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
